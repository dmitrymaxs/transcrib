<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">Transcrib app icon</title>
  <desc id="desc">A rounded app icon showing an audio waveform transforming into text lines.</desc>
  <defs>
    <linearGradient id="bg" x1="128" y1="96" x2="896" y2="928" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0f766e"/>
      <stop offset="0.5" stop-color="#2563eb"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <radialGradient id="glowA" cx="29%" cy="24%" r="52%">
      <stop offset="0" stop-color="#67e8f9" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#67e8f9" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="76%" cy="76%" r="48%">
      <stop offset="0" stop-color="#a7f3d0" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#a7f3d0" stop-opacity="0"/>
    </radialGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="24" stdDeviation="28" flood-color="#020617" flood-opacity="0.35"/>
