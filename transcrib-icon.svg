      d="M238 520h52c18 0 28-14 34-50l20-122c4-28 42-29 47-1l46 314c5 31 48 31 53 0l34-211c5-31 47-32 53-1l20 99c5 26 21 40 45 40h44"
      stroke="url(#accent)"
      stroke-width="28"
