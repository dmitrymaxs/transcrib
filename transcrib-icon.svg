    <rect x="642" y="448" width="214" height="44" rx="22" opacity="0.86"/>
    <rect x="642" y="552" width="150" height="44" rx="22" opacity="0.72"/>
    <rect x="642" y="656" width="202" height="44" rx="22" opacity="0.56"/>
